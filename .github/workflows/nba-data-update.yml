name: NBA data update

# Pulls finished games from ESPN and writes them to Supabase.
# Runs hourly; the updater auto-detects playoff/regular/offseason mode.
# Use "Run workflow" for manual backfills (from/to) or dry runs.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "Start date YYYY-MM-DD (optional; default = day after last loaded game)"
        required: false
        type: string
      to:
        description: "End date YYYY-MM-DD (optional; default = today)"
        required: false
        type: string
      mode:
        description: "Pipeline mode"
        required: false
        default: auto
        type: choice
        options: [auto, playoff, regular, offseason]
      dry_run:
        description: "Fetch and parse only; no DB writes"
        required: false
        default: false
        type: boolean

concurrency:
  group: nba-data-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update NBA data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scripts/update-nba-games-scripts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/update-nba-games-scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Supabase connection
        env:
          SUPABASE_API_URL: ${{ secrets.SUPABASE_API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Fail fast on a wrong URL or key. The updater treats read errors as
          # empty tables, which would otherwise look like a fresh database.
          status=$(curl -sS -o /tmp/preflight.json -w '%{http_code}' \
            "${SUPABASE_API_URL%/}/rest/v1/schedules?select=game_id,game_date&order=game_date.desc&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY") || status="curl-error"
          echo "HTTP $status"
          head -c 300 /tmp/preflight.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Supabase request failed (HTTP $status). Check SUPABASE_API_URL and SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi
          if [ "$(cat /tmp/preflight.json)" = "[]" ]; then
            echo "::error::schedules table is empty. SUPABASE_API_URL may point at the wrong project."
            exit 1
          fi

      - name: Run updater
        env:
          SUPABASE_API_URL: ${{ secrets.SUPABASE_API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$SUPABASE_API_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_API_URL and SUPABASE_SERVICE_ROLE_KEY secrets must be set"
            exit 1
          fi

          args=(--mode "${INPUT_MODE:-auto}")
          [ -n "$INPUT_FROM" ] && args+=(--from "$INPUT_FROM")
          [ -n "$INPUT_TO" ] && args+=(--to "$INPUT_TO")
          [ "$INPUT_DRY_RUN" = "true" ] && args+=(--dry-run)

          echo "Running: node update-nba-data.js ${args[*]}"
          node update-nba-data.js "${args[@]}"
